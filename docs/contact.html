<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — RadialDeck</title>
<meta name="description" content="Questions, team and company licences, support or a ring to share: write to the people who make RadialDeck.">
<link rel="icon" href="assets/icon.png">
<style>
  :root { color-scheme: dark; --bg: #0f1116; --card: #171a22; --line: #2a2f3b; --text: #f2f3f7; --muted: #9aa1b2; --accent: #3b82f6; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 20px 72px; }
  a { color: #60a5fa; }
  h1 { font-size: 40px; letter-spacing: -.02em; line-height: 1.1; margin: 18px 0 8px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  form { display: grid; gap: 16px; padding: 24px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
  input, select, textarea { font: inherit; font-weight: 400; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: #0f1116; color: inherit; }
  textarea { min-height: 150px; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
  .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  button { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; justify-self: start; }
  button[disabled] { opacity: .6; cursor: default; }
  .status { margin: 0; font-size: 15px; }
  .status.ok { color: #86efac; } .status.err { color: #fca5a5; }
  .fine { color: var(--muted); font-size: 14px; margin-top: 18px; }
</style>
<!-- seo -->
<link rel="canonical" href="https://radialdeck.com/contact.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="RadialDeck">
<meta property="og:url" content="https://radialdeck.com/contact.html">
<meta property="og:title" content="Contact — RadialDeck">
<meta property="og:description" content="Questions, team and company licences, support or a ring to share: write to the people who make RadialDeck.">
<meta property="og:image" content="https://radialdeck.com/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Contact — RadialDeck">
<meta name="twitter:description" content="Questions, team and company licences, support or a ring to share: write to the people who make RadialDeck.">
<meta name="twitter:image" content="https://radialdeck.com/assets/og.jpg">
<!-- /seo -->
</head>
<body><div class="wrap">
<p><a href="index.html">← RadialDeck</a></p>
<h1>Talk to us</h1>
<p class="lead">A question, a team or company licence, a bug, or a ring worth sharing. A person reads every message and answers by e-mail, usually within a working day.</p>
<form id="f" novalidate>
  <div class="row">
    <label>Name <input name="name" autocomplete="name" maxlength="100"></label>
    <label>E-mail <input name="email" type="email" autocomplete="email" required maxlength="200"></label>
  </div>
  <label>Topic
    <select name="topic">
      <option value="general">General question</option>
      <option value="team">Team or company licences</option>
      <option value="support">Support or a bug</option>
      <option value="ring">Share a ring (paste the link below)</option>
      <option value="press">Press</option>
    </select>
  </label>
  <label>Message <textarea name="message" required maxlength="5000"></textarea></label>
  <label class="trap" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>
  <button id="go">Send</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</form>
<p class="fine">Your message and address are used only to answer you. See the <a href="privacy.html">privacy policy</a>.</p>
</div>
<script>
const f = document.getElementById('f'), status = document.getElementById('status'), go = document.getElementById('go');
const topic = new URLSearchParams(location.search).get('topic');
if (topic && f.topic.querySelector(`option[value="${CSS.escape(topic)}"]`)) f.topic.value = topic;
const say = (text, ok) => { status.textContent = text; status.className = 'status ' + (ok ? 'ok' : 'err'); };
f.addEventListener('submit', async e => {
  e.preventDefault();
  if (!f.email.checkValidity() || !f.email.value) return say('Please check your e-mail address.', false);
  if (f.message.value.trim().length < 5) return say('Please write a few words.', false);
  go.disabled = true; say('Sending…', true);
  try {
    const r = await fetch('/api/contact', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(Object.fromEntries(new FormData(f))) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error);
    f.reset(); say('Thank you. Your message is on its way and we will answer by e-mail.', true);
  } catch (err) {
    say((err && err.message) || 'The message could not be sent. Please try again in a minute, or write to hello@radialdeck.com.', false);
  } finally { go.disabled = false; }
});
</script>
</body>
</html>
